name: Import PrismCast alpha.41 source

on:
  push:
    paths:
      - '.source-import/READY'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and import confirmed alpha.41 snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat .source-import/alpha41.b64.* | base64 -d > /tmp/prismcast-alpha41.zip
          echo "f184b15919a0531bd6020d8c63d6d8c55b63ef19e723799fa289ed58b4de49d8  /tmp/prismcast-alpha41.zip" | sha256sum -c -
          unzip -q -o /tmp/prismcast-alpha41.zip -d /tmp/prismcast-alpha41
          rsync -a /tmp/prismcast-alpha41/ ./
          rm -rf .source-import
          rm -f .github/workflows/import-alpha41-final.yml
          rm -f patches/0.2.0-alpha.32-mobile-library.patch
          git config user.name "PrismCast Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Sync full confirmed PrismCast alpha.41 source"
          git push origin HEAD:${GITHUB_REF_NAME}
