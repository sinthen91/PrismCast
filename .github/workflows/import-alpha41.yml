name: Import confirmed PrismCast alpha.41 source

on:
  push:
    branches:
      - alpha41-import-fast
    paths:
      - '.source-import/READY'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat .source-import/alpha41.b64.* | base64 -d > /tmp/prismcast-alpha41.zip
          echo "f184b15919a0531bd6020d8c63d6d8c55b63ef19e723799fa289ed58b4de49d8  /tmp/prismcast-alpha41.zip" | sha256sum -c -
          rm -rf /tmp/prismcast-alpha41
          mkdir -p /tmp/prismcast-alpha41
          unzip -q /tmp/prismcast-alpha41.zip -d /tmp/prismcast-alpha41
          rsync -a --delete --exclude='.git/' --exclude='directory-service/' --exclude='patches/' /tmp/prismcast-alpha41/ ./
          rm -rf .source-import
          rm -f .github/workflows/import-alpha41.yml

      - name: Commit complete alpha.41 source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PrismCast Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Sync full confirmed PrismCast alpha.41 source"
          git push origin HEAD:main
