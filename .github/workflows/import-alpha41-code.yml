name: Import PrismCast alpha.41 code

on:
  push:
    branches:
      - alpha41-source-final-code
    paths:
      - '.source-import/READY'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and import confirmed alpha.41 source
        shell: bash
        run: |
          set -euo pipefail
          cat .source-import/code.b64.* | base64 -d > /tmp/prismcast-alpha41-code.zip
          echo "736ac4235894698a24651f1e926b0c0fef486f194a3b51ff7b03fde2b7af8f5d  /tmp/prismcast-alpha41-code.zip" | sha256sum -c -
          unzip -q -o /tmp/prismcast-alpha41-code.zip -d /tmp/prismcast-alpha41
          rsync -a /tmp/prismcast-alpha41/ ./
          rm -rf .source-import
          rm -f .github/workflows/import-alpha41-code.yml
          rm -f patches/0.2.0-alpha.32-mobile-library.patch
          git config user.name "PrismCast Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Sync confirmed PrismCast alpha.41 source code"
          git push origin HEAD:${GITHUB_REF_NAME}
