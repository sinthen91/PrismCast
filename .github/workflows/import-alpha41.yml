name: Import tested PrismCast alpha.41 source

on:
  push:
    paths:
      - '.source-import/PrismCast-0.2.0-alpha.41-source.zip'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import tested alpha.41 source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/prismcast-alpha41
          mkdir -p /tmp/prismcast-alpha41
          unzip -q -o .source-import/PrismCast-0.2.0-alpha.41-source.zip -d /tmp/prismcast-alpha41
          rsync -a /tmp/prismcast-alpha41/ ./
          rm -rf .source-import
          rm -f .github/workflows/import-alpha41.yml

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PrismCast Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Import confirmed PrismCast alpha.41 source"
          git push origin HEAD:main
